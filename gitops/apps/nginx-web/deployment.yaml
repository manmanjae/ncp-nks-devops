apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: web-app
spec:
  #  replicas: 3
  selector:
    matchLabels:
      app: nginx-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nginx-web
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nginx-web
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ncr-local-secret
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-web-config
        - name: nginx-tls
          secret:
            secretName: nginx-backend-tls
      containers:
        - name: nginx
          image: klgghf8x.kr.private-ncr.ntruss.com/nginx-lab:sha-d7929e6e82b6549a03d36dd658ae9bf7a4e566a9
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-tls
              mountPath: /etc/nginx/tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: https
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: https
            initialDelaySeconds: 15
            periodSeconds: 10
