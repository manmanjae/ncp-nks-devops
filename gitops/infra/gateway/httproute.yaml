apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-web
  namespace: web-app
spec:
  parentRefs:
    - name: nginx-gateway
      sectionName: https

  hostnames:
    - kimmj.mapprime.co.kr

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-web
          port: 443
          weight: 1
