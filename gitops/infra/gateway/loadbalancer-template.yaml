apiVersion: loadbalancer.vnks.ncloud.com/v1alpha1
kind: LoadBalancerTemplate
metadata:
  name: nginx-alb
  namespace: web-app
spec:
  networkType: PUBLIC
  size: SMALL
  lbSubnetIds:
    - 328734
  idleTimeoutSeconds: 60
  accessLogEnabled: false
  skipAcgUpdate: false


  defaults:
    targetGroup:
      protocol: HTTPS
      algorithmType: RR
      healthCheck:
        protocol: HTTPS
        method: GET
        path: /healthz
        port: 0

  listeners:
    - port: 443
      protocol: HTTPS
      aclId: 0
      tls:
        certificateNos:
          - 69648  # argocd.mapprime.co.kr
          - 69668  # kimmj.mapprime.co.kr
        minVersion: TLSV12
      targetGroup:
        protocol: HTTPS
        algorithmType: RR
        healthCheck:
          protocol: HTTPS
          method: GET
          path: /healthz
          port: 0
