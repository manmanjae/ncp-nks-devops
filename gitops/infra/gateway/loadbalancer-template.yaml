apiVersion: loadbalancer.vnks.ncloud.com/v1alpha1
kind: LoadBalancerTemplate
metadata:
  name: nginx-alb
  namespace: web-app
spec:
  networkType: PUBLIC
  size: SMALL
  lbSubnetIds:
    - 328734
  idleTimeoutSeconds: 60
  accessLogEnabled: false
  skipAcgUpdate: false
  defaults:
    targetGroup:
      protocol: HTTP
      algorithmType: RR
      healthCheck:
        protocol: HTTP
        method: GET
        path: /
        port: 0

  # HTTPS Listener에만 적용
  listeners:
    - port: 443
      protocol: HTTPS
      tls:
        certificateNos:
          - 69648
        minVersion: TLSV12
      targetGroup:
        protocol: HTTPS
        algorithmType: RR
        healthCheck:
          protocol: HTTPS
          method: GET
          path: /healthz
          port: 0
