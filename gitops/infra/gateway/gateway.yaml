apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gateway
  namespace: web-app
spec:
  gatewayClassName: ncloud-alb
  infrastructure:
    parametersRef:
      group: loadbalancer.vnks.ncloud.com
      kind: LoadBalancerTemplate
      name: nginx-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    # argocd 네임스페이스의 Route만 연결 허용
    - name: argocd-https
      hostname: argocd.mapprime.co.kr
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
