apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gateway
  namespace: web-app
spec:
  gatewayClassName: ncloud-alb
  infrastructure:
    parametersRef:
      group: loadbalancer.vnks.ncloud.com
      kind: LoadBalancerTemplate
      name: nginx-alb

  listeners:
    # 기존 Argo CD Route 참조를 유지하기 위해 이름 유지
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - web-app
                  - argocd
