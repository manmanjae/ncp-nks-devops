apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gateway
  namespace: web-app
spec:
  gatewayClassName: ncloud-alb
  infrastructure:
    parametersRef:
      group: loadbalancer.vnks.ncloud.com
      kind: LoadBalancerTemplate
      name: nginx-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
